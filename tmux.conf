# tmux-perso — Catppuccin Macchiato (tmux >= 3.2)
# Aucun raccourci modifie : prefix Ctrl+B par defaut.

set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -g mouse on
set -g history-limit 50000
set -s set-clipboard external
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 70
set -g status-right-length 140

# TPM gere les plugins ; Catppuccin doit etre charge AVANT les modules.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'rounded'

# Le repertoire TPM utilise pour catppuccin/tmux est ~/.tmux/plugins/tmux.
if-shell 'test -f "$HOME/.tmux/plugins/tmux/catppuccin.tmux"' 'run-shell "$HOME/.tmux/plugins/tmux/catppuccin.tmux"'

# Segment gauche : session et dernier dossier du panneau actif.
set -g status-left '#[fg=#24273a,bg=#c6a0f6,bold] #S #[default] #[fg=#a6da95,bg=#363a4f] #{b:pane_current_path} #[default] '

# Modules CPU/RAM : l'expansion -F est indispensable pour les variables
# tmux-cpu qui seront substituees au chargement par TPM.
set -g status-right ''
set -agF status-right '#{E:@catppuccin_status_cpu}'
set -agF status-right '#{E:@catppuccin_status_ram}'

# Cache automatiquement le GPU si nvidia-smi est indisponible (Docker/macOS).
# Le script est installe dans ~/.tmux-perso/status-gpu.sh par setup.sh.
set -ag status-right '#($HOME/.tmux-perso/status-gpu.sh)'
set -ag status-right '#[fg=#8aadf4,bg=#363a4f] #(TZ=Europe/Paris date "+%d/%m/%Y %H:%M") #[default]'

# TPM DOIT etre initialise apres la construction de status-right.
run-shell "$HOME/.tmux/plugins/tpm/tpm"
