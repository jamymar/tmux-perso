# tmux-perso — Catppuccin Macchiato
# tmux >= 3.2 | raccourcis tmux inchanges (Ctrl+B)

set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"

# Souris : defilement, selection et gestion des panneaux
set -g mouse on
set -g history-limit 50000
# Copie vers le presse-papiers du terminal si OSC 52 est pris en charge
set -s set-clipboard external

set -g status-position bottom
set -g status-interval 5
set -g status-left-length 50
set -g status-right-length 160

# Plugins geres par TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Theme
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'rounded'

# TPM stocke catppuccin/tmux dans ~/.tmux/plugins/tmux
# Le charger avant d'utiliser les formats de ses modules.
if-shell 'test -f "$HOME/.tmux/plugins/tmux/catppuccin.tmux"' 'run-shell "$HOME/.tmux/plugins/tmux/catppuccin.tmux"'

# A gauche : session + nom du dossier courant (sans chemin complet)
set -g status-left '#{E:@catppuccin_status_session} #[fg=#a6da95]󰉋 #{b:pane_current_path} '

# A droite : CPU, RAM, GPU (NVIDIA si nvidia-smi), heure francaise
set -g status-right '#{E:@catppuccin_status_cpu}'
set -agF status-right '#{E:@catppuccin_status_ram}'
set -ag status-right ' #[fg=#c6a0f6]GPU #[fg=#cad3f5]#{gpu_percentage} '
set -ag status-right ' #[fg=#8aadf4]#(TZ=Europe/Paris date "+%d/%m/%Y %H:%M") '

# Ne pas changer les touches par defaut.
# TPM doit rester en derniere ligne.
run-shell "$HOME/.tmux/plugins/tpm/tpm"
